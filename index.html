<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harputoğlu Orman Ürünleri | 1968'den Günümüze</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0f0d;
            --card-bg: rgba(20, 29, 24, 0.65);
            --accent-gold: #d4af37;
            --accent-green: #2e7d32;
            --accent-light: #4caf50;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* Arka Plan Video Hero */
        .hero-container {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.35) contrast(1.1);
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10,15,13,0.3) 0%, rgba(10,15,13,0.95) 100%);
            z-index: 2;
        }

        /* Glassmorphism Header */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(10, 15, 13, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 12px 30px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo-box img { height: 42px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-links a:hover { color: var(--accent-gold); }

        /* Hero İçerik */
        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 900px;
